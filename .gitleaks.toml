# Gitleaks configuration: the default rules, plus one narrow allowlist.
# Public 20-byte EVM addresses (contracts, tokens) trigger the generic-api-key rule.
# 32-byte hex strings are deliberately NOT allowlisted: a private key looks like one.
title = "TokenIQ"

[extend]
useDefault = true

[allowlist]
description = "Public EVM contract and token addresses"
regexTarget = "secret"
regexes = ['''^0x[0-9a-fA-F]{40}$''']
paths = ['''packages/contracts/lib/''']
